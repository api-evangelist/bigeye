  artifacts: [openapi/bigeye-metadata-openapi.json, openapi/bigeye-observability-openapi.json,
    openapi/bigeye-sensitivity-openapi.json]
- id: rfc9727-api-catalog
  conforms: true
  evidence: https://docs.bigeye.com/.well-known/api-catalog returns 200 application/linkset+json
    listing all three OpenAPI definitions as service-desc links.
  artifacts: [well-known/bigeye-api-catalog.json]
- id: rfc9264-linkset
  conforms: true
  evidence: The api-catalog document is an RFC 9264 linkset with anchor / service-desc
    / service-doc members.
- id: model-context-protocol
  conforms: true
  evidence: Hosted MCP server at https://mcpgateway.bigeye.com/mcp answers JSON-RPC
    tools/list over streamable HTTP with 56 tools carrying inputSchema and outputSchema.
  artifacts: [mcp/bigeye-mcp.yml, mcp/bigeye-mcp-tools-list.json]
- id: llmstxt
  conforms: true
  evidence: https://docs.bigeye.com/llms.txt returns 200 text/plain, 505 lines, with
    Guides / API Reference / Recipes link sections.
  artifacts: [llms/bigeye-llms.txt]
- id: grpc-gateway
  conforms: true
  evidence: All specs carry protobufAny and runtimeError components and "generated"-prefixed
    schema names; operationIds follow <Service>_<Method>. The underlying services
    are gRPC, though no .proto files are published.
- id: oauth2
  conforms: false
  evidence: No oauth2 securityScheme in any spec and no OAuth flow documented for the
    Bigeye API. (Auth0 is used for end-user SSO into the app, not for API authorization.)
- id: oidc
  conforms: false
  evidence: No openIdConnect securityScheme; /.well-known/openid-configuration returns
    404 on every host.
- id: rfc9457-problem-details
  conforms: false
  evidence: Errors use the grpc-gateway runtimeError object on application/json, not
    application/problem+json.
- id: idempotency-key
  conforms: false
  evidence: No Idempotency-Key parameter, header or body field in any of the 263 operations,
    and no retry-safety contract in the docs.
- id: rfc8594-sunset-header
  conforms: false
  evidence: No deprecation policy and no Sunset/Deprecation header support documented.
- id: rfc9116-security-txt
  conforms: false
  evidence: /.well-known/security.txt returns 404 on www.bigeye.com, docs.bigeye.com
    and mcpgateway.bigeye.com.
- id: a2a-agent-card
  conforms: false
  evidence: /.well-known/agent-card.json and /.well-known/agent.json return 404 on
    every Bigeye host (app.bigeye.com answers 200 with an SPA HTML shell for all
    /.well-known/* paths, which was rejected as a false positive).
- id: asyncapi
  conforms: false
  evidence: No AsyncAPI document published; the event surface is a documented webhook
    only. See asyncapi/bigeye-webhooks.yml.
- id: json-api
  conforms: false
  evidence: Responses are plain JSON objects generated from protobuf messages, not
    JSON:API documents.
- id: odata
  conforms: false
- id: scim2
  conforms: false
  evidence: User, group and role management is exposed through Bigeye's own
    UserService/GroupService/RoleService operations, not SCIM 2.0 endpoints.
