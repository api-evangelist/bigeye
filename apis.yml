aid: bigeye
name: Bigeye
description: 'Bigeye is an enterprise data observability and AI trust platform that
  monitors data quality, detects schema changes and anomalies, classifies sensitive
  data, and maps column-level lineage across warehouses, lakes, BI tools and ETL
  pipelines. The platform combines automated data quality monitoring, ML-powered
  anomaly detection and lineage-based root-cause and downstream-impact analysis so
  teams can find and resolve data issues before they reach dashboards, reports or
  AI systems. Bigeye is API-first: its REST API is published as three OpenAPI 3.0
  definitions (Metadata, Observability and Sensitivity) covering 263
  operations, and it ships a first-party Python SDK, a Python CLI, Airflow
  operators, YAML-based observability-as-code configuration, and a hosted Model
  Context Protocol gateway that exposes 56 agent tools over the same platform.'
url: https://raw.githubusercontent.com/api-evangelist/bigeye/refs/heads/main/apis.yml
image: https://cdn.prod.website-files.com/64b205c9041f2a26ac7cb23f/69135c34ecede8d3fb8c6be8_bigeye-logo-1200x1200.jpg
x-type: company
x-source: harvest:secondary-market
specificationVersion: '0.23'
created: '2026-08-02'
modified: '2026-08-02'
tags:
- Company
- Data Observability
- Data Quality
- Data Lineage
- Data Governance
- Metadata Management
- Data Catalog
- Sensitive Data Discovery
- Monitoring
- Analytics
- AI Trust
- Snowflake
- Databricks
apis:
- aid: bigeye:bigeye-mcp-gateway
  name: Bigeye MCP Gateway
  description: >-
    The Bigeye MCP Gateway is a hosted Model Context Protocol server at https://mcpgateway.bigeye.com/mcp
    that exposes 56 tools over the Bigeye platform for AI assistants and agents — listing and triaging
    data quality issues, searching the catalog, tracing lineage, profiling tables, managing metrics, dimensions
    and tags, and reading sensitive-data scan findings. Authentication uses the same Bigeye API key passed
    as an "apikey" prefixed Authorization header plus an x-bigeye-workspace-id header. Public beta since
    July 2026; the server is also open source and self-hostable.
  humanURL: https://docs.bigeye.com/docs/bigeye-mcp-server
  baseURL: https://mcpgateway.bigeye.com/mcp
  tags:
  - MCP
  - Agents
  - AI
  properties:
  - type: MCPServer
    url: mcp/bigeye-mcp.yml
  - type: ToolCrosswalk
    url: mcp/bigeye-tool-crosswalk.yml
  - type: Documentation
    url: https://docs.bigeye.com/docs/bigeye-mcp-server
  - type: SourceCode
