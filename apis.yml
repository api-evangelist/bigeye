apis:
- aid: bigeye:bigeye-metadata-api
  name: Bigeye Metadata API
  description: >-
    The Bigeye Metadata API covers the data catalog and workspace administration
    surface: sources, schemas, tables, columns and virtual tables; catalog rebuilds
    and schema-change tracking; lineage (v1 and v2) nodes and edges; users, groups,
    roles, workspaces and object ownership; agent registration, API keys and service
    accounts; integrations, named schedules, tags, favorites, search, dashboards and
    workflow status.
  humanURL: https://docs.bigeye.com/reference
  baseURL: https://app.bigeye.com
  tags:
  - Catalog
  - Metadata
  - Lineage
  - Schemas
  - Tables
  - Columns
  - Sources
  - Workspaces
  - Users
  - API Keys
  properties:
  - type: OpenAPI
    url: openapi/bigeye-metadata-openapi.json
  - type: Documentation
    url: https://docs.bigeye.com/docs/api-user-guide
  - type: APIReference
    url: https://docs.bigeye.com/reference
  - type: Overlay
    url: overlays/bigeye-metadata-overlay.yaml
- aid: bigeye:bigeye-observability-api
  name: Bigeye Observability API
  description: >-
    The Bigeye Observability API covers monitoring and data quality: metrics
    (monitors) and metric templates, custom SQL rules, autometrics, backfills and
    batch metric runs, collections of monitors, deltas and comparison tables for
    cross-source validation, joins, observed columns, data quality dimensions, and
    the issue lifecycle including merging issues into incidents.
  humanURL: https://docs.bigeye.com/reference
  baseURL: https://app.bigeye.com
  tags:
  - Monitoring
  - Metrics
  - Data Quality
  - Issues
  - Incidents
  - Collections
  - Deltas
  - Custom Rules
  - Dimensions
  properties:
  - type: OpenAPI
    url: openapi/bigeye-observability-openapi.json
  - type: Documentation
    url: https://docs.bigeye.com/docs/monitoring
  - type: APIReference
    url: https://docs.bigeye.com/reference
  - type: Overlay
    url: overlays/bigeye-observability-overlay.yaml
- aid: bigeye:bigeye-sensitivity-api
  name: Bigeye Sensitivity API
  description: >-
    The Bigeye Sensitivity API covers sensitive data discovery and classification:
    classifiers, data classes and data class categories, scan jobs and scan job
    configuration, scan runs, and the aggregate and snapshot findings that report
    where PII and other sensitive data was detected across connected sources.
  humanURL: https://docs.bigeye.com/reference
  baseURL: https://app.bigeye.com
  tags:
  - Sensitive Data
  - Classification
  - PII
  - Scanning
  - Data Governance
  properties:
  - type: OpenAPI
    url: openapi/bigeye-sensitivity-openapi.json
  - type: Documentation
    url: https://docs.bigeye.com/docs/getting-started-scanning
  - type: APIReference
    url: https://docs.bigeye.com/reference
  - type: Overlay
    url: overlays/bigeye-sensitivity-overlay.yaml
- aid: bigeye:bigeye-mcp-gateway
  name: Bigeye MCP Gateway
  description: >-
    The Bigeye MCP Gateway is a hosted Model Context Protocol server at
    https://mcpgateway.bigeye.com/mcp that exposes 56 tools over the Bigeye
    platform for AI assistants and agents — listing and triaging data quality
    issues, searching the catalog, tracing lineage, profiling tables, managing
    metrics, dimensions and tags, and reading sensitive-data scan findings.
    Authentication uses the same Bigeye API key passed as an "apikey" prefixed
    Authorization header plus an x-bigeye-workspace-id header. Public beta since
    July 2026; the server is also open source and self-hostable.
  humanURL: https://docs.bigeye.com/docs/bigeye-mcp-server
  baseURL: https://mcpgateway.bigeye.com/mcp
  tags:
  - MCP
  - Agents
  - AI
