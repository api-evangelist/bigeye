        failureReason:
          $ref: '#/components/schemas/generatedMetricRunFailureReason'
        grainEndEpochSeconds:
          format: int64
          title: end of grain for METRIC_TIME based runs
          type: string
        grainStartEpochSeconds:
          format: int64
          title: start of grain for METRIC_TIME based runs
          type: string
        groupDimensions:
          items:
            $ref: '#/components/schemas/generatedMetricGroupDimension'
          type: array
        groupName:
          type: string
        hasRowCounts:
          type: boolean
        hasRowsMatched:
          type: boolean
        id:
          format: int32
          type: integer
        isPosthoc:
          type: boolean
        metricRunAnnotation:
          $ref: '#/components/schemas/generatedMetricRunAnnotation'
        observedValue:
          format: double
          type: number
        rowsMatched:
          format: int64
          type: string
        rowsScanned:
          format: int64
          type: string
        runAtEpochSeconds:
          format: int64
          type: string
        status:
          $ref: '#/components/schemas/generatedMetricRunStatus'
        summaryStatus:
          $ref: '#/components/schemas/generatedMetricStatus'
        thresholds:
          items:
            $ref: '#/components/schemas/generatedConstantThreshold'
          type: array
      type: object
    generatedNamedSchedule:
      properties:
        cron:
          type: string
        entityInfo:
          $ref: '#/components/schemas/generatedEntityInfo'
        id:
          format: int32
          type: integer
        name:
          type: string
        timezone:
          description: IANA timezone id (e.g. "America/New_York") used to interpret the cron. Defaults to UTC when unset.
          type: string
      type: object
    generatedDeltaInfo:
      properties:
        comparisonTargetInfos:
          items:
            $ref: '#/components/schemas/generatedDeltaTargetInfo'
          type: array
        delta:
          $ref: '#/components/schemas/generatedDelta'
        isFavorite:
          type: boolean
        nextRunEpochSeconds:
          format: int64
          type: string
      type: object
    generatedMetricRunLabel:
      default: METRIC_RUN_LABEL_UNSPECIFIED
      enum:
      - METRIC_RUN_LABEL_UNSPECIFIED
      - METRIC_RUN_LABEL_TRUE_NEGATIVE
      - METRIC_RUN_LABEL_FALSE_NEGATIVE
      - METRIC_RUN_LABEL_TRUE_POSITIVE
      - METRIC_RUN_LABEL_FALSE_POSITIVE
      - METRIC_RUN_LABEL_UNDETERMINED
      - METRIC_RUN_LABEL_EXPECTED
      type: string
    generatedCustomRuleInfo:
      properties:
        activeIssue:
          $ref: '#/components/schemas/generatedIdAndDisplayName'
        collections:
          items:
            $ref: '#/components/schemas/generatedIdAndDisplayName'
          type: array
        createdAtEpochSeconds:
          format: int64
          type: string
        createdBy:
          $ref: '#/components/schemas/generatedUser'
        customRule:
          $ref: '#/components/schemas/generatedCustomRule'
        id:
          format: int32
          type: integer
        isFavorite:
          type: boolean
        latestRuns:
          items:
            $ref: '#/components/schemas/generatedMetricRun'
          type: array
        metricId:
          format: int32
          type: integer
        updatedAtEpochSeconds:
          format: int64
          type: string
        updatedBy:
          $ref: '#/components/schemas/generatedUser'
        warehouse:
          $ref: '#/components/schemas/generatedIdAndDisplayName'
      type: object
    generatedPaginationInfo:
      properties:
        firstSortDistinctValues:
          format: int64
          type: string
        nextCursor:
          type: string
        noNumRecords:
          type: boolean
        numRecords:
          format: int32
          type: integer
        prevCursor:
          type: string
      type: object
    generatedDeltaTargetInfo:
      properties:
        alertingGroupCount:
          format: int32
          type: integer
        alertingMetricCount:
          format: int64
          type: string
        comparisonColumnInfos:
          items:
            $ref: '#/components/schemas/generatedComparisonColumnInfo'
          type: array
        comparisonMetricInfos:
          items:
            $ref: '#/components/schemas/generatedComparisonMetricInfo'
          type: array
        failedGroupCount:
          format: int32
          type: integer
        failedMetricCount:
          format: int64
          type: string
        isTargetTableDeleted:
          type: boolean
        keysInAllCount:
          format: int64
          type: string
        keysOnlyInSourceCount:
          format: int64
          type: string
        keysOnlyInTargetCount:
          format: int64
          type: string
        lastRunAtEpochSeconds:
          format: int64
          type: string
        metricCount:
          format: int64
          type: string
        schemaMatch:
          type: boolean
        sourceRowCount:
          format: int64
          type: string
        targetRowCount:
          format: int64
          type: string
        targetSchema:
          $ref: '#/components/schemas/generatedIdAndDisplayName'
        targetSource:
          $ref: '#/components/schemas/generatedIdAndDisplayName'
        targetTable:
          $ref: '#/components/schemas/generatedIdAndDisplayName'
        targetWarehouseType:
