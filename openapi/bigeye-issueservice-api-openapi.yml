        issueType:
          items:
            $ref: '#/components/schemas/generatedIssueType'
          type: array
        maxOpenedTime:
          format: int64
          type: string
        metricIds:
          items:
            format: int32
            type: integer
          type: array
        metricStatus:
          items:
            $ref: '#/components/schemas/generatedMetricStatus'
          type: array
        metricType:
          items:
            $ref: '#/components/schemas/generatedMetricType'
          type: array
        metricTypes:
          items:
            $ref: '#/components/schemas/generatedPredefinedMetricName'
          type: array
        minOpenedTime:
          format: int64
          type: string
        monitorTypes:
          items:
            $ref: '#/components/schemas/generatedMonitorType'
          type: array
        parentIssueIds:
          items:
            format: int32
