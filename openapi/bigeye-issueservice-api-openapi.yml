            format: int32
            type: integer
          type: array
        columnIds:
          items:
            format: int32
            type: integer
          type: array
        dimensionIds:
          items:
            format: int32
            type: integer
          type: array
        ids:
          items:
            format: int32
            type: integer
          type: array
        isRootCause:
