        closedIssuesIds:
          items:
            format: int32
            type: integer
          type: array
        hasAutothresholdMetrics:
          type: boolean
        lastIssueClosedEpochSeconds:
          format: int64
          type: string
        lastIssueEpochSeconds:
          format: int64
          type: string
        monitoringIssuesIds:
          items:
            format: int32
            type: integer
          type: array
        newIssuesIds:
          items:
            format: int32
            type: integer
          type: array
        priority:
          $ref: '#/components/schemas/generatedIssuePriority'
