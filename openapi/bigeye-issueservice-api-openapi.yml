openapi: 3.2.0
info:
  title: Observability Issue Service API
  version: version not set
servers:
- url: https://app.bigeye.com
security:
- basicAuth: []
- Personal_API_Key: []
tags:
- name: IssueService
paths:
  /api/v1/issues/batch:
    put:
      operationId: IssueService_BatchUpdateIssues
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/generatedUpdateIssueBatchRequestWrapper'
        required: true
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generatedUpdateIssueBatchResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
      summary: Batch update issues
      tags:
      - IssueService
  /api/v1/issues/bulk:
    put:
      operationId: IssueService_BulkUpdateIssues
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/generatedBulkIssueUpdate'
        required: true
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generatedBulkResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
      summary: Performs bulk issues updates
      tags:
      - IssueService
  /api/v1/issues/{issueId}:
    get:
      operationId: IssueService_GetIssue
      parameters:
      - in: path
        name: issueId
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generatedGetIssuesResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
      summary: Get issue
      tags:
      - IssueService
    put:
      operationId: IssueService_UpdateIssue
      parameters:
      - in: path
        name: issueId
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/generatedUpdateIssueRequest'
        required: true
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generatedUpdateIssueResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
      summary: Update issue
      tags:
      - IssueService
  /api/v1/issues/fetch:
    post:
      operationId: IssueService_GetIssues
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/generatedGetIssuesRequest'
        required: true
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generatedGetIssuesResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
      summary: Get issues
      tags:
      - IssueService
  /api/v1/issues/tables/fetch:
    post:
      operationId: IssueService_GetTableIssues
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/generatedGetIssueTableSummaryRequest'
        required: true
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generatedGetIssueTableSummaryResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
      summary: Get issues summary by table
      tags:
      - IssueService
components:
