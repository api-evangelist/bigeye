          $ref: '#/components/schemas/generatedEntityInfo'
        id:
          format: int32
          type: integer
        leftColumn:
          $ref: '#/components/schemas/generatedTableColumn'
        rightColumn:
          $ref: '#/components/schemas/generatedTableColumn'
      type: object
    generatedIssueAiOverviewUpdate:
      properties:
        createdBy:
          $ref: '#/components/schemas/generatedUser'
