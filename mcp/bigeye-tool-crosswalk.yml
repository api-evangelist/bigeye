coverage:
  tools_named: 56
  tools_bound_to_openapi: 21
  tools_on_unpublished_rest: 21
  tools_composite_or_clientside: 14
  rest_operations_total: 263
  rest_operations_with_a_tool: 22
  rest_operations_without_a_tool: 241
findings:
- The MCP surface and the OpenAPI surface are NOT projections of the same contract. 21 of 56 MCP tools
  bind to a published operationId; 21 more call real /api/v2/* (and a few /api/v1/*) endpoints that appear
  in NO published OpenAPI definition — notably the whole v2 tag surface (/api/v2/tags*), global search
  (/api/v2/search), table profiling (/api/v2/tables/{id}/profile*), lineage search (/api/v2/lineage/search)
  and issue merge/unmerge/resolution.
- 'The reverse gap is far larger: 241 of 263 published REST operations have no MCP tool. The agent surface
  is a deliberately curated slice (issues, catalog search, lineage, dimensions, tags, profiling, sensitivity
  findings) rather than a generated wrapper.'
- 'A v1/v2 divergence runs through tags: the OpenAPI publishes /api/v1/tags* (TagService_*) while the
  MCP server calls /api/v2/tags*. Only list_entity_tags lands on a published operation.'
