- name: get_dataset_health_summary
  description: "Get a health overview of datasets (tables): monitoring status and open issues per dataset,\
    \ rolled up per schema. This is the recommended single-call tool for questions like \"show me the\
    \ health of my datasets\" or \"which tables are alerting?\".\n\n    Combines the table catalog, latest\
    \ metric run statuses, and open issues into\n    a compact report:\n    - summary: workspace/scope\
    \ totals (tables monitored/alerting/healthy/unknown/\n      unmonitored — \"unknown\" means monitored\
    \ but every metric's latest run\n      status is indeterminate, e.g. never run)\n    - schemas: per-schema\
    \ rollup with table and issue counts\n    - attention: per-table detail for datasets that are alerting\
    \ or have open\n      issues (capped by max_tables), including a brief issue list\n    - healthy_monitored_tables:\
    \ monitored datasets with no alerts or open issues\n\n    A dataset counts as \"monitored\" when at\
    \ least one metric is configured on it.\n    \"Alerting\" means a metric's latest run breached thresholds\
    \ or the dataset has\n    an open (new/acknowledged/monitoring) issue.\n\n    Args:\n        warehouse_name:\
    \ Optional warehouse (data source) name to scope the report,\n            e.g. \"MinnCo-Bronze-Snowflake\"\
    . Case-insensitive exact match.\n        schema_name: Optional schema name to scope the report. Use\
    \ the same format\n            shown elsewhere: \"database.schema\" when the warehouse has a database\n\
    \            layer (e.g. \"MINNCO_BRONZE.dbo\"), plain schema otherwise (e.g. \"dbo\").\n        \
    \    Case-insensitive exact match.\n        max_tables: Maximum number of tables to detail in the\
    \ attention list\n            (default: 25). Counts in summary/schemas are never truncated."
  category: platform
  input_arguments:
  - max_tables
  - schema_name
  - warehouse_name
  required: []
- name: get_ai_agent_trust_hub
  description: "Get information about AI agents in the workspace, the users who talked to them, their\
    \ conversations, and the tables/columns those conversations accessed. Use this for questions like\
    \ \"which AI agents are running up cost\", \"who is talking to this agent\", \"what did this conversation\
    \ touch\", or \"which agents have accessed this table\".\n\n    With no arguments, returns the workspace\
    \ overview: every registered agent\n    (identity, platform, trust scores, data sources, conversation\
    \ count,\n    total token usage/cost, distinct accessed tables), every user who has\n    talked to\
    \ an agent (conversation count, total cost/tokens, agents used,\n    their single most expensive conversation),\
    \ and the most expensive\n    conversations in the workspace.\n\n    Narrow it by supplying one identifier,\
    \ checked in this order:\n    - table_name, column_name, or object_name: aggregate access info for\n\
    \      matching tables/columns (access count, distinct agent count, monitor\n      and finding counts,\
    \ max sensitivity, certification status), matched\n      case-insensitively as a substring. NOTE:\
    \ this view is aggregate only —\n      it cannot say which specific users accessed the object, only\
    \ how many\n      distinct agents did and how often.\n    - conversation_id: one conversation's cost,\
    \ tokens, and the tables it\n      accessed with their sensitivity/monitoring/issue status.\n    -\
    \ username: that user's conversations across every agent, with cost and\n      token totals.\n   \
    \ - agent_id or agent_external_id: that agent's conversations and the\n      per-user breakdown of\
    \ who has talked to it.\n\n    Conversation lists are capped by max_conversations; every response\n\
    \    reports the true count and whether the list was truncated. Use sort_by\n    to choose which conversations\
    \ are kept when a list is capped.\n\n    Args:\n        agent_id: The numeric Bigeye id of an agent.\n\
    \        agent_external_id: The external id of an agent, as reported by its\n            platform.\
    \ Equivalent to agent_id; use whichever you have.\n        username: A username recorded on conversations\
    \ (usually an email).\n        conversation_id: The numeric Bigeye id of a conversation.\n       \
    \ table_name: Part of a table name to look up aggregate access info by.\n        column_name: Part\
    \ of a column name to look up aggregate access info by.\n        object_name: Part of a table or column\
    \ name to look up aggregate\n            access info by (matches either).\n        sort_by: Which\
    \ conversations to keep when a list is capped: \"recent\"\n            (default), \"cost\", or \"\
    tokens\".\n        max_conversations: Maximum number of conversations to return in any\n         \
    \   single list (default: 25)."
