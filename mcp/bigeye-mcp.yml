- name: lineage_track_data_access
  description: "Track data assets accessed by an AI agent.\n    \n    This tool allows AI agents to track\
    \ which tables and columns they've accessed\n    during their analysis. The tracked assets can later\
    \ be committed to Bigeye's\n    lineage graph to show data dependencies.\n    \n    Args:\n      \
    \  qualified_names: List of fully qualified names of accessed assets.\n                        Supports\
    \ formats:\n                        - database.schema.table\n                        - database.schema.table.column\n\
    \                        - warehouse.database.schema.table\n                        - warehouse.database.schema.table.column\n\
    \        agent_name: Optional custom name for the agent (defaults to system-based name)\n        \n\
    \    Returns:\n        Dictionary containing tracking status and summary\n        \n    Example:\n\
    \        # Track table access\n        await track_data_access([\n            \"SNOWFLAKE.SALES.PUBLIC.ORDERS\"\
    ,\n            \"SNOWFLAKE.SALES.PUBLIC.CUSTOMERS\"\n        ])\n        \n        # Track column-level\
    \ access\n        await track_data_access([\n            \"SALES.PUBLIC.ORDERS.order_id\",\n     \
    \       \"SALES.PUBLIC.ORDERS.customer_id\",\n            \"SALES.PUBLIC.CUSTOMERS.customer_name\"\
    \n        ])"
  category: lineage
  input_arguments:
  - agent_name
  - qualified_names
  required:
  - qualified_names
- name: lineage_get_tracking_status
  description: "Get the current status of lineage tracking.\n    \n    Returns information about all data\
    \ assets currently being tracked\n    by the agent, before they are committed to Bigeye's lineage\
    \ graph.\n    \n    Returns:\n        Dictionary containing tracking status and tracked assets"
  category: lineage
  input_arguments: []
  required: []
- name: lineage_commit_agent
  description: "Commit tracked data access to Bigeye's lineage graph.\n    \n    This creates lineage\
    \ edges between the AI agent and all tracked data assets,\n    showing which tables and columns the\
    \ agent has accessed during its analysis.\n    \n    Args:\n        rebuild_graph: Whether to rebuild\
    \ the lineage graph after creating edges (default: True)\n        clear_after_commit: Whether to clear\
    \ tracked assets after successful commit (default: True)\n        \n    Returns:\n        Dictionary\
    \ containing commit results and any errors\n        \n    Example:\n        # First track some data\
    \ access\n        await track_data_access([\n            \"SALES.PUBLIC.ORDERS\",\n            \"\
    SALES.PUBLIC.CUSTOMERS\"\n        ])\n        \n        # Then commit to Bigeye\n        result =\
    \ await commit_agent_lineage()\n        print(f\"Created {result['edges_created']} lineage edges\"\
    )"
  category: lineage
  input_arguments:
  - clear_after_commit
  - rebuild_graph
  required: []
- name: lineage_clear_tracked_assets
  description: "Clear all tracked data assets without committing.\n    \n    Use this to reset the tracking\
    \ state without creating lineage edges.\n    \n    Returns:\n        Dictionary confirming the clear\
    \ operation"
  category: lineage
  input_arguments: []
  required: []
- name: lineage_cleanup_agent_edges
  description: "Clean up old lineage edges for the AI agent.\n    \n    This removes lineage edges older\
    \ than the specified retention period,\n    but ONLY for edges where the AI agent is involved. This\
    \ ensures we\n    don't accidentally delete existing lineage between tables.\n    \n    Args:\n  \
    \      retention_days: Number of days to retain lineage edges (default: 30)\n        \n    Returns:\n\
    \        Dictionary containing cleanup results\n        \n    Example:\n        # Clean up edges older\
    \ than 7 days\n        result = await cleanup_agent_lineage_edges(retention_days=7)\n        print(f\"\
    Deleted {result['edges_deleted']} old edges\")"
  category: lineage
  input_arguments:
  - retention_days
  required: []
