    ).\n\n    Args:\n        query: The column name or partial name to search for (e.g. \"email\", \"\
    user_id\")\n        limit: Maximum number of results to return (default: 50)"
  category: catalog
  input_arguments:
  - limit
  - query
  required:
  - query
