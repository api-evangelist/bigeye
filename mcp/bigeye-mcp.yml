- name: lineage_explore_catalog
  description: "Explore tables in Bigeye's catalog. For browsing the data catalog, prefer list_tables\
    \ + list_schemas (knowledgebase).\n\n    This diagnostic tool helps discover how tables are named\
    \ and structured in Bigeye's catalog.\n    \n    Args:\n        schema_name: Optional schema name\
    \ to filter by (e.g., \"PROD_REPL\")\n        warehouse_name: Optional warehouse name to filter by\
    \ (e.g., \"SNOWFLAKE\")\n        search_term: Optional search term to filter table names\n       \
    \ page_size: Number of results to return (default: 50)\n        \n    Returns:\n        Dictionary\
    \ containing catalog tables with their full names\n        \n    Example:\n        # Find all tables\
    \ in PROD_REPL schema\n        await explore_catalog_tables(schema_name=\"PROD_REPL\")\n        \n\
    \        # Find tables with \"ORDER\" in the name\n        await explore_catalog_tables(search_term=\"\
    ORDER\")"
  category: lineage
  input_arguments:
  - page_size
  - schema_name
  - search_term
  - warehouse_name
  required: []
- name: lineage_delete_node
  description: "Delete a custom lineage node from Bigeye's lineage graph.\n    \n    This tool removes\
    \ a custom lineage node (such as an AI agent node) from \n    the lineage graph. It will also attempt\
    \ to remove all associated edges.\n    \n    WARNING: This operation cannot be undone. Use with caution.\n\
    \    \n    Args:\n        node_id: The ID of the custom lineage node to delete\n        force: Force\
    \ deletion even if node has active edges (default: False)\n        \n    Returns:\n        Dictionary\
    \ containing deletion results\n        \n    Example:\n        # Delete an agent node\n        result\
    \ = await lineage_delete_node(node_id=12345)\n        print(f\"Deleted node {result['node_id']}\"\
    )\n        \n        # Force delete even with edges\n        result = await lineage_delete_node(node_id=12345,\
    \ force=True)"
  category: lineage
  input_arguments:
  - force
  - node_id
  required:
  - node_id
- name: list_report_upstream_issues
  description: "List upstream data quality issues affecting a BI report or dashboard. Requires the report's\
    \ lineage node_id. To discover reports/dashboards first, use list_catalog_entities (knowledgebase).\n\
    \n    Args:\n        report_id: The lineage node ID of the BI report/dashboard"
  category: issues
  input_arguments:
  - report_id
  required:
  - report_id
- name: get_table_profile
  description: "Get the data profile report for a table including column statistics, data distribution,\
    \ and profile history. Requires table_id.\n\n    Args:\n        table_id: The ID of the table to get\
    \ the profile for"
  category: profiling
  input_arguments:
  - table_id
  required:
  - table_id
- name: create_profile_job
  description: "Queue a new data profiling job for a table. Returns a workflow ID to track progress with\
    \ get_profile_job_status. Requires table_id.\n\n    Args:\n        table_id: The ID of the table to\
    \ queue profiling for"
  category: profiling
  input_arguments:
  - table_id
  required:
  - table_id
- name: get_profile_job_status
  description: "Check the status of a profiling job (queued, running, completed). Requires table_id.\n\
    \n    Args:\n        table_id: The ID of the table to check profiling workflow status for"
  category: profiling
  input_arguments:
  - table_id
  required:
  - table_id
- name: list_dimensions
  description: List all data-quality dimensions with their metric type mappings. Returns each dimension's
    name, top-level category (PIPELINE_RELIABILITY or DATA_QUALITY), and the metric types that belong
    to it. For a table-specific coverage analysis that maps dimensions to existing monitors, use get_table_dimension_coverage.
  category: monitoring
  input_arguments: []
  required: []
- name: get_dimension
  description: "Get full details for a single Data Dimension by its ID. Returns the dimension's name,\
    \ description, and entity metadata.\n\n    Args:\n        dimension_id: The ID of the dimension to\
    \ retrieve"
  category: monitoring
  input_arguments:
  - dimension_id
  required:
  - dimension_id
- name: create_dimension
  description: "Create a new Data Dimension in the Bigeye workspace.\n\n    Args:\n        name: The name\
    \ for the new dimension\n        description: Optional description for the dimension"
  category: monitoring
  input_arguments:
  - description
  - name
  required:
  - name
- name: update_dimension
  description: "Update an existing Data Dimension's name or description.\n\n    Args:\n        dimension_id:\
    \ The ID of the dimension to update\n        name: New name for the dimension (optional)\n       \
    \ description: New description for the dimension (optional)"
  category: monitoring
  input_arguments:
  - description
  - dimension_id
  - name
  required:
  - dimension_id
- name: delete_dimension
  description: "Delete a Data Dimension by its ID. This action is permanent.\n\n    Args:\n        dimension_id:\
    \ The ID of the dimension to delete"
  category: monitoring
  input_arguments:
  - dimension_id
  required:
  - dimension_id
- name: list_table_level_metrics
  description: List metric types that are table-level (not column-level). Returns metric names like FRESHNESS,
    VOLUME, COUNT_ROWS, etc. Use this to distinguish table-level from column-level metrics when analyzing
    coverage.
  category: monitoring
  input_arguments: []
  required: []
- name: create_metric
  description: "Create a new metric (monitor) on a table. Supports predefined metric types like COUNT_ROWS,\
    \ PERCENT_NULL, FRESHNESS, etc.\n\n    Column-level metrics (e.g. PERCENT_NULL, COUNT_DISTINCT) require\
    \ column_name.\n    Table-level metrics (e.g. COUNT_ROWS, FRESHNESS) must NOT have column_name.\n\n\
    \    Prefer passing table_id for reliable lookups. Falls back to name-based search if table_id is\
    \ not provided.\n\n    Args:\n        table_name: Name of the table to create the metric on\n    \
    \    metric_type: Predefined metric type (e.g. COUNT_ROWS, PERCENT_NULL, FRESHNESS)\n        column_name:\
    \ Column to monitor (required for column-level metrics, omit for table-level)\n        schema_name:\
    \ Optional schema name to disambiguate table search\n        table_id: Table ID — preferred, avoids\
    \ ambiguous name lookups\n        name: Optional display name for the metric\n        description:\
    \ Optional description for the metric\n        lookback_type: Optional lookback type — DATA_TIME,\
    \ CLOCK_TIME, or METRIC_TIME\n        lookback_interval_type: Optional interval type — only DAYS is\
    \ supported for metric lookback\n        lookback_interval_value: Optional interval value (e.g. 7)\n\
    \        filters: Optional list of SQL filter expressions\n        group_bys: Optional list of column\
    \ names to group by"
  category: monitoring
  input_arguments:
  - column_name
  - description
  - filters
  - group_bys
  - lookback_interval_type
  - lookback_interval_value
  - lookback_type
  - metric_type
  - name
  - schema_name
  - table_id
  - table_name
  required:
  - metric_type
  - table_name
- name: get_table_dimension_coverage
  description: "Analyze which data quality dimensions are covered by monitors on a table and which have\
    \ gaps. Automatically joins the workspace's dimension taxonomy, the table's column metadata, and existing\
    \ metrics to produce: per-column coverage, table-level coverage, an aggregate score, and a prioritized\
    \ gap list with suggested metric types. This is the recommended single-call tool for answering 'what\
    \ monitoring is missing on this table?'\n\n    Prefer passing table_id for reliable lookups. Falls\
    \ back to name-based search if table_id is not provided.\n\n    Args:\n        table_name: Table name\
    \ to analyze (used as fallback if table_id not provided)\n        schema_name: Optional schema name\
    \ to narrow name-based search\n        table_id: Table ID — preferred, avoids ambiguous name lookups"
  category: monitoring
  input_arguments:
  - schema_name
  - table_id
  - table_name
  required: []
- name: get_column_dimension_coverage
  description: "Analyze dimension coverage for specific columns in a table. Same analysis as get_table_dimension_coverage\
    \ but filtered to the requested columns. Use this when you already know which columns to investigate\
    \ — for example, after identifying columns with issues or when a user asks about specific fields.\
    \ Always includes table-level dimension coverage for context.\n\n    Prefer passing table_id for reliable\
    \ lookups. Falls back to name-based search if table_id is not provided.\n\n    Args:\n        table_name:\
    \ Table name to analyze (used as fallback if table_id not provided)\n        column_names: List of\
    \ column names to analyze coverage for\n        schema_name: Optional schema name to narrow name-based\
    \ search\n        table_id: Table ID — preferred, avoids ambiguous name lookups"
  category: monitoring
  input_arguments:
  - column_names
  - schema_name
  - table_id
  - table_name
  required: []
- name: list_tags
  description: "List or search workspace tags. Returns tag IDs, names, and colors. Use search to filter\
    \ by name.\n\n    Args:\n        search: Optional search string to filter tags by name\n        page_size:\
    \ Number of tags per page (default 50)\n        page_cursor: Pagination cursor from a previous response"
  category: tags
  input_arguments:
  - page_cursor
  - page_size
  - search
  required: []
- name: create_tag
  description: "Create a new workspace tag. Tags can be applied to metrics, tables, columns, and other\
    \ entities.\n\n    Args:\n        name: Tag display name (max 60 characters)\n        color_hex: Optional\
    \ hex color with # prefix (e.g. \"#FF5733\"). Must be 3 or 6 hex digits."
  category: tags
  input_arguments:
  - color_hex
  - name
  required:
  - name
- name: update_tag
  description: "Update an existing workspace tag's name or color.\n\n    Args:\n        tag_id: ID of\
    \ the tag to update\n        name: New tag name (optional, max 60 characters)\n        color_hex:\
    \ New hex color with # prefix (optional, e.g. \"#FF5733\")"
  category: tags
  input_arguments:
  - color_hex
  - name
  - tag_id
  required:
  - tag_id
- name: delete_tag
  description: "Delete a workspace tag. This removes the tag from all entities it was applied to.\n\n\
    \    Args:\n        tag_id: ID of the tag to delete"
  category: tags
  input_arguments:
  - tag_id
  required:
  - tag_id
- name: tag_entity
  description: "Apply a workspace tag to an entity. The tag must already exist (use create_tag first).\n\
    \n    Args:\n        tag_id: ID of the workspace tag to apply\n        entity_id: ID of the entity\
    \ to tag (e.g. metric ID, table ID)\n        entity_type: Entity type — SOURCE, SCHEMA, TABLE, METRIC,\
    \ COLUMN, DELTA, SLA, or CUSTOM_RULE"
  category: tags
  input_arguments:
  - entity_id
  - entity_type
  - tag_id
  required:
  - entity_id
  - entity_type
  - tag_id
- name: untag_entity
  description: "Remove a workspace tag from an entity.\n\n    Args:\n        tag_id: ID of the workspace\
    \ tag to remove\n        entity_id: ID of the entity to untag\n        entity_type: Entity type —\
    \ SOURCE, SCHEMA, TABLE, METRIC, COLUMN, DELTA, SLA, or CUSTOM_RULE"
  category: tags
  input_arguments:
  - entity_id
  - entity_type
  - tag_id
  required:
  - entity_id
  - entity_type
  - tag_id
- name: list_entity_tags
  description: "List all tags applied to a specific entity.\n\n    Args:\n        entity_id: ID of the\
    \ entity\n        entity_type: Entity type — SOURCE, SCHEMA, TABLE, METRIC, COLUMN, DELTA, SLA, or\
    \ CUSTOM_RULE"
  category: tags
  input_arguments:
  - entity_id
  - entity_type
  required:
  - entity_id
  - entity_type
- name: list_glossary_terms
  description: "List or search business glossary terms. Use search to match by name or synonym.\n\n  \
    \  Args:\n        search: Optional search string matched against term name and synonyms\n        statuses:\
    \ Optional list of statuses to filter by — DRAFT, REVIEW, APPROVED, or DEPRECATED\n            (short\
    \ names or full enum values like GLOSSARY_TERM_STATUS_DRAFT)\n        owner_ids: Optional list of\
    \ owner user IDs to filter by\n        page_size: Number of terms per page (default 50)\n        page_cursor:\
    \ Pagination cursor from a previous response"
- name: create_glossary_term
  description: "Create a new business glossary term.\n\n    Term names must be unique per workspace (case-insensitive).\
    \ Use list_glossary_terms(search=...)\n    first to check whether a term with this name already exists.\n\
    \n    Args:\n        name: Term name, e.g. \"Net revenue\"\n        description: Optional markdown\
    \ description of the term\n        synonyms: Optional list of synonym strings, e.g. [\"NR\"]\n   \
    \     examples: Optional free-text usage examples\n        status: Optional status — DRAFT, REVIEW,\
    \ APPROVED, or DEPRECATED (defaults to DRAFT)\n        owner_id: Optional owner user ID (defaults\
    \ to the creating user if omitted)\n        steward_id: Optional steward user ID"
- name: update_glossary_term
  description: "Update a business glossary term.\n\n    Use list_glossary_terms(search=<name>) first to\
    \ resolve a term name to its term_id.\n\n    IMPORTANT: name, description, examples, status, owner,\
    \ and steward are only changed\n    when you pass them — omitted fields are left alone. synonyms is\
    \ the one exception:\n    it's a repeated field with no such presence-tracking on the server, so an\
    \ update call\n    that omits it entirely is indistinguishable from \"clear all synonyms\" and WIPES\
    \ the\n    existing list, even if you're only changing an unrelated field like status. To protect\n\
    \    against this, this tool always fetches the current term first and carries its existing\n    synonyms\
    \ forward unless you explicitly pass synonyms (full replace) or add_synonyms\n    (merge in without\
    \ removing current ones).\n\n    Args:\n        term_id: ID of the term to update\n        name: New\
    \ name (optional)\n        description: New markdown description (optional)\n        synonyms: New\
    \ full list of synonyms, replacing the existing list (optional)\n        add_synonyms: Synonyms to\
    \ add to the existing list without removing current ones (optional)\n        examples: New examples\
    \ text (optional)\n        status: New status — DRAFT, REVIEW, APPROVED, or DEPRECATED (optional)\n\
    \        owner_id: New owner user ID; pass 0 to clear (optional)\n        steward_id: New steward\
    \ user ID; pass 0 to clear (optional)"
- name: delete_glossary_term
  description: "Delete a business glossary term. This also removes all of its entity links.\n\n    Args:\n\
    \        term_id: ID of the term to delete"
- name: link_glossary_term_to_entity
  description: "Link a glossary term to a catalog entity (source, schema, table, or column).\n\n    Use\
    \ list_glossary_terms(search=<name>) to resolve a term name to its term_id, and\n    search_tables/search_columns/search_schemas\
    \ to resolve the entity to its ID.\n\n    Args:\n        term_id: ID of the glossary term\n      \
    \  entity_id: ID of the catalog entity to link\n        entity_type: Entity type — SOURCE, SCHEMA,\
    \ TABLE, or COLUMN"
- name: unlink_glossary_term_from_entity
  description: "Remove the link between a glossary term and a catalog entity.\n\n    Args:\n        term_id:\
    \ ID of the glossary term\n        entity_id: ID of the catalog entity to unlink\n        entity_type:\
    \ Entity type — SOURCE, SCHEMA, TABLE, or COLUMN"
- name: get_glossary_term_links
  description: "List the catalog entities linked to a glossary term.\n\n    Use list_glossary_terms(search=<name>)\
    \ first to resolve a term name to its term_id.\n\n    Args:\n        term_id: ID of the glossary term\n\
    \        search: Optional search string to filter linked entities by name\n        page_cursor: Pagination\
    \ cursor from a previous response"
- name: get_entity_glossary_terms
  description: "Get the glossary terms linked to a catalog entity (e.g. is this column linked to any terms?).\n\
    \n    Args:\n        entity_id: ID of the catalog entity\n        entity_type: Entity type — SOURCE,\
    \ SCHEMA, TABLE, or COLUMN"
- name: list_data_classes
  description: "List data classification categories configured in Bigeye.\n\n    Returns data classes\
    \ (e.g., \"Email Address\", \"Credit Card\", \"US SSN\") with their\n    sensitivity levels (PUBLIC,\
    \ INTERNAL, CONFIDENTIAL, RESTRICTED).\n\n    Args:\n        search: Optional search string to filter\
    \ data classes by name\n        sensitivities: Optional list of sensitivity levels to filter by. Possible\
    \ values:\n            - DATA_SENSITIVITY_PUBLIC\n            - DATA_SENSITIVITY_INTERNAL\n      \
    \      - DATA_SENSITIVITY_CONFIDENTIAL\n            - DATA_SENSITIVITY_RESTRICTED\n        page_size:\
    \ Optional number of results per page\n        page_cursor: Cursor for pagination\n\n    Returns:\n\
    \        Dictionary containing data classes with their names, sensitivity levels, and descriptions"
  category: sensitivity
  input_arguments:
  - page_cursor
  - page_size
  - search
  - sensitivities
  required: []
- name: get_table_sensitivity_findings
  description: "Get sensitive data scan findings for a specific table by name.\n\n    Resolves the table\
    \ name, then fetches sensitivity findings from Bigeye's\n    Sensitive Data Scanning (SDS) feature\
    \ showing which columns contain PII\n    or sensitive data and what data classes were detected.\n\n\
    \    Args:\n        table_name: Name of the table to get sensitivity findings for\n        schema_name:\
    \ Optional schema name to narrow the table search\n        finding_type: Either \"aggregate\" (all-time\
    \ summary, default) or \"snapshot\"\n            (findings from a specific scan run)\n        sensitivities:\
    \ Optional list of sensitivity levels to filter by.\n            Valid values: PUBLIC, INTERNAL, CONFIDENTIAL,\
    \ RESTRICTED\n        positive_only: If True, return only positive (matched) findings.\n         \
    \   If False, return only negative findings. Default returns both.\n        page_size: Number of findings\
    \ to return per page\n        page_cursor: Pagination cursor from a previous response"
  category: sensitivity
  input_arguments:
  - finding_type
  - page_cursor
  - page_size
  - positive_only
  - schema_name
  - sensitivities
  - table_name
  required:
  - table_name
- name: get_scan_findings
  description: "Get data classification scan findings from Bigeye using raw IDs.\n\n    Lower-level tool\
    \ for querying findings across multiple tables/columns by ID.\n    For a single table by name, prefer\
    \ get_table_sensitivity_findings instead.\n\n    Args:\n        table_ids: Optional list of Bigeye\
    \ table IDs to filter findings\n        column_ids: Optional list of Bigeye column IDs to filter findings\n\
    \        data_class_ids: Optional list of data class IDs to filter by classification type\n      \
    \  sensitivities: Optional list of sensitivity levels to filter by. Possible values:\n           \
    \ - DATA_SENSITIVITY_PUBLIC\n            - DATA_SENSITIVITY_INTERNAL\n            - DATA_SENSITIVITY_CONFIDENTIAL\n\
    \            - DATA_SENSITIVITY_RESTRICTED\n        positive_only: If true, only return findings where\
    \ sensitive data was detected.\n            If false (default), return both positive and negative\
    \ findings.\n        finding_type: Either \"aggregate\" (all-time summary, default) or \"snapshot\"\
    \n            (findings from a specific scan run)\n        search: Optional search string to filter\
    \ results\n        page_size: Optional number of results per page\n        page_cursor: Cursor for\
    \ pagination"
  category: sensitivity
  input_arguments:
  - column_ids
  - data_class_ids
  - finding_type
  - page_cursor
  - page_size
  - positive_only
  - search
  - sensitivities
  - table_ids
  required: []
