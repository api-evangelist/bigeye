    \ for the issue\n        closing_label: Required when new_status is ISSUE_STATUS_CLOSED\n        priority:\
    \ New priority (ISSUE_PRIORITY_LOW, ISSUE_PRIORITY_MED, ISSUE_PRIORITY_HIGH)\n        message: Timeline\
