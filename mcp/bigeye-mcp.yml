- name: list_issues
  description: "List data quality issues across the workspace. Supports filtering by status (ISSUE_STATUS_NEW,\
    \ ISSUE_STATUS_ACKNOWLEDGED, ISSUE_STATUS_CLOSED, ISSUE_STATUS_MONITORING, ISSUE_STATUS_MERGED), schema,\
    \ assignee, and collection. Returns compact summaries by default. Best for broad views like 'show\
    \ all open issues'. To find issues assigned to the current user, first call get_current_user to get\
    \ their integer 'id', then pass it as assignee_ids=[id]. To filter by collection, call list_collections\
    \ first to resolve a collection name to its ID. For issues on a specific table, use list_table_issues\
    \ instead.\n\n    Args:\n        statuses: Optional list of issue statuses to filter by. Possible\
    \ values:\n            - ISSUE_STATUS_NEW\n            - ISSUE_STATUS_ACKNOWLEDGED\n            -\
    \ ISSUE_STATUS_CLOSED\n            - ISSUE_STATUS_MONITORING\n            - ISSUE_STATUS_MERGED\n\
    \        schema_names: Optional list of schema names to filter issues by\n        assignee_ids: Optional\
    \ list of integer user IDs to filter issues by assignee.\n            To filter by the current user\
    \ (\"assigned to me\"), call get_current_user\n            first and use the returned 'id'.\n    \
    \    collection_ids: Optional list of collection IDs to filter issues by.\n            Collections\
    \ group related metrics (data products, domains, etc.).\n            Call list_collections() to resolve\
    \ a collection name to its ID first.\n        page_size: Optional number of issues to request from\
    \ API per page (default: 20)\n        page_cursor: Cursor for pagination\n        compact: If True\
    \ (default), returns only minimal fields (id, name, status, table, schema).\n                When\
    \ an issue has an assignee, the output also includes `assignee`\n                (name/email) and\
    \ `assigneeId` (integer ID) — useful for verifying\n                assignee filtering.\n        \
    \        If False, returns standard fields including description and metric info.\n              \
    \  Use compact=True to list issues, then get_issue() for specifics.\n        max_issues: Maximum number\
    \ of issues to return (default: 15). Prevents context overload.\n                   Set to None to\
    \ return all issues (use with caution)."
  category: issues
  input_arguments:
  - assignee_ids
  - collection_ids
  - compact
  - max_issues
  - page_cursor
  - page_size
  - schema_names
  - statuses
  required: []
- name: get_issue
  description: "Get full details for a single issue by its internal ID (not display name). Returns event\
    \ history, metric details, and metadata. To find an issue's internal ID from its display name, use\
    \ search_issues first.\n\n    Args:\n        issue_id: The internal database ID of the issue (from\
    \ the 'id' field in issue lists)"
  category: issues
  input_arguments:
  - issue_id
  required:
  - issue_id
- name: search_issues
  description: "Find issues or incidents by their display name — the number shown in the Bigeye UI (e.g.\
    \ '10921'). ALWAYS use this when a user references an issue by number. Returns matching issues with\
    \ their internal IDs for use with get_issue, update_issue, and other tools.\n\n    Args:\n       \
    \ name_query: The issue name or partial name to search for (e.g., \"10921\", \"data-quality\")\n \
    \       statuses: Optional list of issue statuses to filter by. Possible values:\n            - ISSUE_STATUS_NEW\n\
    \            - ISSUE_STATUS_ACKNOWLEDGED\n            - ISSUE_STATUS_CLOSED\n            - ISSUE_STATUS_MONITORING\n\
    \            - ISSUE_STATUS_MERGED\n        exact_match: If True, only return exact name matches.\
    \ If False (default),\n                    returns partial matches (case-insensitive)"
  category: issues
  input_arguments:
  - exact_match
  - name_query
  - statuses
  required:
  - name_query
- name: search_schemas
  description: "Search the Bigeye data catalog for schemas by name. Returns matching schemas with their\
    \ internal IDs and warehouse context.\n\n    Schema names are in `database.schema` format when the\
    \ warehouse has a\n    database layer (e.g. Snowflake: \"ANALYTICS.PUBLIC\"); for warehouses without\
    \ a\n    database, the name is just the schema (e.g. \"public\"). Returned `name` values\n    follow\
    \ the same convention.\n\n    Args:\n        query: The schema name or partial name to search for.\
    \ Include the database\n            prefix when applicable (e.g. \"ANALYTICS.PUBLIC\"), or search\
    \ by just the\n            schema part (e.g. \"public\") for a broader match.\n        limit: Maximum\
    \ number of results to return (default: 50)"
  category: catalog
  input_arguments:
  - limit
  - query
  required:
  - query
- name: search_tables
  description: "Search the Bigeye data catalog for tables by name. Returns matching tables with their\
    \ internal IDs, schema, and warehouse context.\n\n    The returned `schemaName` is in `database.schema`\
    \ format when the warehouse\n    has a database layer (e.g. Snowflake: \"ANALYTICS.PUBLIC\"); for\
    \ warehouses\n    without a database, it is just the schema (e.g. \"public\").\n\n    Args:\n    \
    \    query: The table name or partial name to search for (e.g. \"orders\", \"customer\")\n       \
    \ limit: Maximum number of results to return (default: 50)"
  category: catalog
  input_arguments:
  - limit
  - query
  required:
  - query
- name: search_columns
  description: "Search the Bigeye data catalog for columns by name. Returns matching columns with their\
